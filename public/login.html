<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบเจ้าหน้าที่ - ระบบเรียกคิวสัมภาษณ์</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="card-box">
    <h4 class="mb-4 text-center">เข้าสู่ระบบเจ้าหน้าที่</h4>

    <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input
          type="email"
          class="form-control"
          id="email"
          placeholder="xxxxxxxx@gmail.com"
          required
        />
      </div>
      <div class="mb-3">
        <label class="form-label">รหัสผ่าน</label>
        <input type="password" class="form-control" id="password" placeholder="********" required />
      </div>
      <button type="submit" class="btn btn-dark btn-block">เข้าสู่ระบบ</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('d-none');

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (data.ok) {
          window.location.href = '/staff.html';
        } else {
          errorBox.textContent = data.message || 'เข้าสู่ระบบไม่สำเร็จ';
          errorBox.classList.remove('d-none');
        }
      } catch (err) {
        errorBox.textContent = 'เชื่อมต่อ server ไม่ได้ ลองใหม่อีกครั้ง';
        errorBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>

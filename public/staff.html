<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>หน้าเจ้าหน้าที่ - ระบบเรียกคิวสัมภาษณ์</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="staff-panel">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0">Staff Dashboard</h5>
      <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">ออกจากระบบ</button>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <button id="addQueueBtn" class="btn btn-dark btn-block mb-2">+ เพิ่มคิวใหม่</button>
        <div id="newQueueBox" class="text-center d-none mt-3">
          <p class="mb-1">คิวที่สร้างล่าสุด</p>
          <h3 id="newQueueNumber" class="mb-3"></h3>
          <img id="qrImg" src="" alt="QR Code" style="width: 180px; height: 180px" />
          <p class="text-muted small mt-2">ให้ผู้เข้าสัมภาษณ์สแกน QR นี้เพื่อดูสถานะคิว</p>
        </div>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body text-center">
        <p class="mb-1 text-muted">คิวที่กำลังเรียก</p>
        <div class="queue-number-big" id="currentCallingNumber">-</div>
        <p class="mt-2 mb-3 text-muted">คิวที่รออยู่: <span id="waitingCount">0</span> คิว</p>

        <div class="d-flex gap-2">
          <button id="callAgainBtn" class="btn btn-outline-dark w-50">เรียกซ้ำ</button>
          <button id="callNextBtn" class="btn btn-dark w-50">เรียกคิวถัดไป</button>
        </div>
      </div>
    </div>

    <button id="resetBtn" class="btn btn-danger btn-block">Reset คิวทั้งหมด</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // เช็คก่อนว่า login อยู่จริงไหม (กันเข้ามาตรง ๆ โดยไม่ login)
    fetch('/api/session')
      .then((r) => r.json())
      .then((data) => {
        if (!data.isStaff) window.location.href = '/login.html';
      });

    const socket = io();

    const currentCallingNumberEl = document.getElementById('currentCallingNumber');
    const waitingCountEl = document.getElementById('waitingCount');

    async function loadOverview() {
      const res = await fetch('/api/queue/overview');
      const data = await res.json();
      if (data.ok) {
        currentCallingNumberEl.textContent = data.currentQueueNumber || '-';
        waitingCountEl.textContent = data.waitingCount;
      }
    }
    loadOverview();

    // ปุ่มเพิ่มคิวใหม่
    document.getElementById('addQueueBtn').addEventListener('click', async () => {
      const res = await fetch('/api/queue/new', { method: 'POST' });
      const data = await res.json();

      if (data.ok) {
        document.getElementById('newQueueNumber').textContent = data.queueNumber;
        document.getElementById('qrImg').src = data.qrCodeDataUrl;
        document.getElementById('newQueueBox').classList.remove('d-none');
        loadOverview();
      } else {
        alert(data.message || 'สร้างคิวไม่สำเร็จ');
      }
    });

    // ปุ่มเรียกคิวถัดไป
    document.getElementById('callNextBtn').addEventListener('click', async () => {
      const res = await fetch('/api/queue/call-next', { method: 'POST' });
      const data = await res.json();
      if (!data.ok) alert(data.message || 'เรียกคิวไม่สำเร็จ');
      loadOverview();
    });

    // ปุ่มเรียกซ้ำ
    document.getElementById('callAgainBtn').addEventListener('click', async () => {
      const res = await fetch('/api/queue/call-again', { method: 'POST' });
      const data = await res.json();
      if (!data.ok) alert(data.message || 'เรียกคิวซ้ำไม่สำเร็จ');
    });

    // ปุ่ม reset
    document.getElementById('resetBtn').addEventListener('click', async () => {
      if (!confirm('ยืนยันการรีเซ็ตคิวทั้งหมด? ข้อมูลคิวทั้งหมดจะถูกลบ')) return;
      const res = await fetch('/api/queue/reset', { method: 'POST' });
      const data = await res.json();
      if (data.ok) {
        document.getElementById('newQueueBox').classList.add('d-none');
        loadOverview();
      }
    });

    // ปุ่ม logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });

    // ฟังการอัปเดตแบบ real-time จาก socket.io เพื่อรีเฟรชตัวเลขอัตโนมัติ
    socket.on('queueUpdate', () => {
      loadOverview();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สถานะคิวของคุณ - ระบบเรียกคิวสัมภาษณ์</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="status-box">
    <div class="card">
      <div class="card-body">
        <div id="loadingBox" class="text-center py-4">กำลังโหลดข้อมูลคิว...</div>

        <div id="contentBox" class="d-none">
          <div class="row text-center">
            <div class="col-6 border-end">
              <p class="text-muted mb-1">หมายเลขคิวของคุณ</p>
              <div class="queue-number-big" id="myQueueNumber">-</div>
            </div>
            <div class="col-6">
              <p class="text-muted mb-1">รออีก (คิว)</p>
              <div class="remaining-big" id="remainingCount">-</div>
            </div>
          </div>

          <hr />

          <p class="text-center mb-0">
            ตอนนี้กำลังเรียกคิวหมายเลข
            <strong id="currentCallingNumber">-</strong>
          </p>

          <p id="myStatusMsg" class="text-center text-success fw-bold mt-3 d-none">
            🎉 ถึงคิวของคุณแล้ว กรุณาเข้าห้องสัมภาษณ์
          </p>
        </div>

        <div id="notFoundBox" class="text-center text-danger py-4 d-none">
          ไม่พบข้อมูลคิวนี้ในระบบ
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // อ่าน queue id จาก URL เช่น /status.html?id=5
    const params = new URLSearchParams(window.location.search);
    const queueId = params.get('id');

    const loadingBox = document.getElementById('loadingBox');
    const contentBox = document.getElementById('contentBox');
    const notFoundBox = document.getElementById('notFoundBox');

    async function loadStatus() {
      if (!queueId) {
        loadingBox.classList.add('d-none');
        notFoundBox.classList.remove('d-none');
        return;
      }

      try {
        const res = await fetch(`/api/queue/status/${queueId}`);
        const data = await res.json();

        loadingBox.classList.add('d-none');

        if (!data.ok) {
          notFoundBox.classList.remove('d-none');
          return;
        }

        contentBox.classList.remove('d-none');
        document.getElementById('myQueueNumber').textContent = data.myQueueNumber;
        document.getElementById('remainingCount').textContent = data.remaining;
        document.getElementById('currentCallingNumber').textContent =
          data.currentCalling || '-';

        // ถ้าสถานะของเราเปลี่ยนเป็น calling แล้ว ให้ขึ้นข้อความแจ้งเตือน
        const msgEl = document.getElementById('myStatusMsg');
        if (data.myStatus === 'calling') {
          msgEl.classList.remove('d-none');
        } else {
          msgEl.classList.add('d-none');
        }
      } catch (err) {
        loadingBox.classList.add('d-none');
        notFoundBox.classList.remove('d-none');
      }
    }

    loadStatus();

    // เชื่อม socket.io เพื่อรับอัปเดตแบบ real-time ทุกครั้งที่เจ้าหน้าที่เรียกคิว
    const socket = io();
    socket.on('queueUpdate', () => {
      loadStatus();
    });

    // เผื่อ socket หลุด ให้ดึงข้อมูลซ้ำทุก 10 วินาทีเป็น fallback
    setInterval(loadStatus, 10000);
  </script>
</body>
</html>
